<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도제반 알림판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 상단 고정 앱바 + 탭, 아래 단일 컬럼 작업 영역(최대 960px). 실습실 작업지시서 느낌의 차분한 청회색 + 안전주황 포인트 */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#e9edf1; --line:#d6dde4;
  --ink:#16202b; --muted:#5b6876; --accent:#d4561c; --accent-ink:#ffffff; --brand:#1f3a52;
  --ok:#1d7a52; --ok-bg:#e2f3ea; --warn:#a86400; --warn-bg:#fbefd9; --bad:#b4322e; --bad-bg:#f9e3e1; --info:#2c5d9a; --info-bg:#e3ecf8;
  --k-ojt:#1b7f86; --k-off:#4b4fb0; --k-sch:#5a6878; --k-eval:#b07400; --k-evt:#b23a6a; --k-prj:#6a7d12; --k-aft:#2f7d4f; --k-per:#c0392b; --p1:#7a4bb0; --p1-bg:#efe6f8;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --sunk:#222c37; --line:#2e3a47;
  --ink:#e6ebf0; --muted:#9aa8b6; --accent:#f07a3e; --accent-ink:#1a0d05; --brand:#8fb4d6;
  --ok:#5fd19b; --ok-bg:#163327; --warn:#f0b65a; --warn-bg:#3a2c12; --bad:#f08a84; --bad-bg:#3b1d1c; --info:#8bb5ec; --info-bg:#1b2a40;
  --k-ojt:#4fc4cc; --k-off:#9a9ef0; --k-sch:#9aa8b6; --k-eval:#f0b65a; --k-evt:#ee86ae; --k-prj:#b8cc5a; --k-aft:#6fd39a; --k-per:#f2877c; --p1:#c9a6f0; --p1-bg:#2d2240; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#222c37; --line:#2e3a47;
  --ink:#e6ebf0; --muted:#9aa8b6; --accent:#f07a3e; --accent-ink:#1a0d05; --brand:#8fb4d6;
  --ok:#5fd19b; --ok-bg:#163327; --warn:#f0b65a; --warn-bg:#3a2c12; --bad:#f08a84; --bad-bg:#3b1d1c; --info:#8bb5ec; --info-bg:#1b2a40;
  --k-ojt:#4fc4cc; --k-off:#9a9ef0; --k-sch:#9aa8b6; --k-eval:#f0b65a; --k-evt:#ee86ae; --k-prj:#b8cc5a; --k-aft:#6fd39a; --k-per:#f2877c; --p1:#c9a6f0; --p1-bg:#2d2240; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:960px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.bar-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{width:34px;height:34px;border-radius:8px;background:var(--brand);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.ttl{min-width:0;flex:1}
.ttl h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
.ttl p{margin:0;font-size:12.5px;color:var(--muted)}
.ttl .upd{font-size:11px;opacity:.85}
[data-home]{cursor:pointer}
.role{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.role.t{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:9px 12px 11px;font-size:14.5px;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .ti{display:none}
.tab .tl-short{display:none}
#tabs.icons .tab .ti{display:inline;margin-right:4px}
.look-row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.swatch[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.emoji-pick{font-size:22px;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.emoji-pick[aria-pressed="true"]{border:2px solid var(--accent);background:var(--sunk)}
.mark.emoji{background:var(--sunk);font-size:21px}
html.big body{font-size:16.5px}
@media (max-width:640px){
  #tabs{display:grid;grid-template-columns:repeat(var(--cols,7),minmax(0,1fr));gap:0;overflow:visible;margin:0 -6px;padding-bottom:2px}
  #tabs .tab{padding:6px 1px 6px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;border-bottom-width:2px;letter-spacing:-.02em}
  #tabs .tab .tl-long{display:none}
  #tabs .tab .tl-short{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  #tabs.icons .tab .ti{display:block;font-size:18px;line-height:1.15;margin:0}
}

.tab:focus-visible,.btn:focus-visible,.chipbtn:focus-visible,.st:focus-visible,.cal-day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:19px;font-weight:700}
.sec-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid2>*{min-width:0}
.label{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:600;text-transform:uppercase}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.learner{background:var(--info-bg);color:var(--info)}
.chip.pre,.chip.pre2{background:var(--warn-bg);color:var(--warn)}
.chip.pre1{background:var(--p1-bg);color:var(--p1)}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin:0 4px 4px 0}
.src{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;font-size:11px;font-weight:700;flex:none;background:var(--sunk);color:var(--muted)}
.src.drive{background:#e4f1e6;color:#1e7a3a}.src.notion{background:var(--ink);color:var(--surface)}
.mat{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.mat:last-child{border-bottom:0}.mat>div{min-width:0;flex:1}
.mat a.open{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap}
.mat a.open:hover{text-decoration:underline}
a.lnk{color:var(--info);overflow-wrap:anywhere}
.team{display:flex;flex-direction:column}
.team-h{padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.team-h h3{font-size:16px;font-weight:700}
.ms{display:grid;grid-template-columns:24px 92px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);font-size:14px}
.ms:last-child{border-bottom:0}
.ms.done .t{color:var(--muted);text-decoration:line-through}
.dday{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dday.soon{color:var(--accent);font-weight:600}
.pf-card{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.pf-card:hover{border-color:var(--accent)}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.entry{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.entry:last-child{border-bottom:0}
.entry h3{font-size:16px;font-weight:600}
.entry .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.entry p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch}
.fb{background:var(--info-bg);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px}
.fb b{color:var(--info);font-size:12.5px}
.pf-hero{padding:18px 16px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.pf-hero h3{font-size:20px;font-weight:700}
.chip.pin{background:var(--accent);color:var(--accent-ink)}
.kdot{width:8px;height:8px;border-radius:2px;flex:none;display:inline-block}

/* notices */
.notice{padding:16px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.notice:last-child{border-bottom:0}
.notice h3{font-size:16px;font-weight:600}
.notice .body{white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch}
.notice .meta{font-size:12.5px;color:var(--muted)}
.ack-ok{font-size:13px;color:var(--ok);font-weight:600}
.readers{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px}

/* events */
.ev{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:start}
.ev:last-child{border-bottom:0}
.ev-date{font-family:var(--f-mono);font-size:13px;line-height:1.25;color:var(--muted)}
.ev-date b{display:block;font-size:20px;color:var(--ink);font-weight:500}
.ev-t{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev-s{font-size:13px;color:var(--muted)}
.ev>div{min-width:0}

.cal-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cal-head h3{font-size:16px;font-weight:600;min-width:7.5em;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow{font-size:12px;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.cal-dow.sun{color:var(--bad)}.cal-dow.sat{color:var(--info)}
.cal-day{appearance:none;border:0;background:none;text-align:left;min-height:78px;padding:5px 5px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-day:nth-child(7n){border-right:0}
.cal-day.out{background:var(--sunk);opacity:.6}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-day .d{font-family:var(--f-mono);font-size:12.5px}
.cal-day.today .d{background:var(--ink);color:var(--surface);border-radius:4px;padding:0 4px;align-self:flex-start}
.cal-ev{font-size:11px;line-height:1.3;padding:1px 4px;border-radius:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-more{font-size:11px;color:var(--muted)}
@media (max-width:560px){.cal-day{min-height:54px}.cal-ev{font-size:0;height:5px;padding:0}.cal-more{display:none}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--f-mono);font-size:24px;font-weight:500;line-height:1.2}
.stat .k{font-size:12.5px;color:var(--muted)}

/* attendance */
.att{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.attHours{width:105px;min-width:0}.attNote{max-width:200px;min-width:0}@media(max-width:520px){.att .row{flex-wrap:wrap}.attNote{flex:1;max-width:100%}}
.att .who{min-width:0}
.att .who b{font-weight:600}
.att .who small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:nowrap}
.st{appearance:none;border:0;border-right:1px solid var(--line);background:var(--surface);padding:6px 9px;font-size:13px;cursor:pointer;color:var(--muted)}
.st:last-child{border-right:0}
.st[aria-pressed="true"].s-출석{background:var(--ok-bg);color:var(--ok);font-weight:600}
.st[aria-pressed="true"].s-지각,.st[aria-pressed="true"].s-조퇴{background:var(--warn-bg);color:var(--warn);font-weight:600}
.st[aria-pressed="true"].s-결석{background:var(--bad-bg);color:var(--bad);font-weight:600}
.st[aria-pressed="true"].s-공결{background:var(--info-bg);color:var(--info);font-weight:600}
@media (max-width:520px){.att{grid-template-columns:1fr}}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
th.vert{writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;max-height:9em;padding:8px 4px;font-weight:500}
.pbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;background:var(--ok)}
.rate-low{color:var(--bad);font-weight:600}

input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:13px;color:var(--muted);font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,16,22,.45)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:20px}
dialog h3{font-size:17px}
.dlg-act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px;font-size:15px}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--warn);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.chipbtn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.thread{display:flex;flex-direction:column}
.msg{padding:12px 16px;border-top:1px solid var(--line)}
.msg.t{background:var(--info-bg)}
.msg .who{font-weight:600;font-size:13.5px}
.msg p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.listbtn{appearance:none;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 16px;align-items:start}
.listbtn:hover{background:var(--sunk)}
.listbtn:last-child{border-bottom:0}
.memberpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.memberpick label{display:flex;gap:6px;align-items:center;font-size:13.5px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
@media (max-width:560px){ .mat{flex-wrap:wrap} .mat a.open{flex-basis:100%;padding-left:42px} }

input[type=email],input[type=password]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0} input[type=file]{width:100%;max-width:100%}
body{margin:0} [hidden]{display:none!important}
</style>
</head>
<body>
<style>
.gate{max-width:420px;margin:0 auto;padding-inline:16px;padding-block:40px;display:flex;flex-direction:column;gap:16px}
.gate .mark{width:52px;height:52px;font-size:24px;border-radius:13px}
.gate h1{font-size:22px;font-weight:700;margin:0}
.gate p{margin:0;color:var(--muted)}
.thread .msg{padding:12px 16px;border-top:1px solid var(--line)}
.thread .msg.t{background:var(--info-bg)}
.thread .msg b{font-size:13.5px}
.thread .msg p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.listbtn{appearance:none;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 16px;align-items:start;color:inherit;font:inherit}
.listbtn:hover{background:var(--sunk)}
.listbtn:last-child{border-bottom:0}
.memberpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.memberpick label{display:flex;gap:6px;align-items:center;font-size:13.5px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.loading{position:fixed;top:0;left:0;right:0;height:3px;background:var(--accent);transform-origin:left;animation:ld 1.2s ease-in-out infinite;z-index:30}
@keyframes ld{0%{transform:scaleX(0)}50%{transform:scaleX(.7)}100%{transform:scaleX(1);opacity:0}}

<script>
(() => {
"use strict";
/* 외부 입구 페이지에서 열린 경우: google.script.run 대신 웹앱 주소(DOJEBAN_API)를 쿠키 없이 부릅니다. */
if ((typeof google === "undefined" || !google.script || !google.script.run) && window.DOJEBAN_API) {
  const mkRun = (ok, fail) => new Proxy({}, { get: (_, k) => k === "withSuccessHandler" ? f => mkRun(f, fail) : k === "withFailureHandler" ? f => mkRun(ok, f) : req => {
    fetch(window.DOJEBAN_API, { method: "POST", credentials: "omit", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: k, req }) })
      .then(r => r.json()).then(x => { if (ok) ok(x); }).catch(e => { if (fail) fail(e); });
  } });
  window.google = { script: { run: mkRun(null, null) } };
}
// google.script.run은 Apps Script가 제공한 웹 앱 페이지에서만 사용할 수 있습니다.
if (typeof google === "undefined" || !google.script || !google.script.run) {
  document.querySelector("#shell").hidden = true;
  document.querySelector("#loading").hidden = true;
  document.querySelector("#gate").hidden = false;
  document.querySelector("#gate").innerHTML = `<section class="gate"><div class="mark" aria-hidden="true">도</div><h1>배포한 알림판 주소로 열어 주세요</h1><p>현재 화면에서는 구글 시트에 연결할 수 없습니다.</p><section class="panel pad"><p>선생님은 교육청 계정으로 <b>script.google.com</b>에서 새 프로젝트를 만들고, Code.gs와 HTML 파일 <b>Index</b>에 각각 전체 코드를 붙여넣어 주세요. 개인 계정의 원본 시트는 교육청 계정에 편집 권한으로 공유해야 합니다.</p><ol><li>편집기에서 <b>setupApp_</b>를 한 번 실행합니다.</li><li><b>배포 → 새 배포 → 웹 앱</b>으로 배포합니다. 이미 배포했다면 배포 관리에서 새 버전으로 갱신합니다.</li><li>배포가 끝나면 표시되는 <b>웹 앱 URL</b>을 브라우저에서 엽니다.</li></ol></section><p>학생은 선생님께 받은 알림판 주소를 열어 주세요.</p><p>컴퓨터에 저장된 Index.html을 직접 열거나 일반 웹 서버에 올려서는 실제 알림판을 사용할 수 없습니다.</p></section>`;
  return;
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); };
const DOW = ["일","월","화","수","목","금","토"];
const fmtMD = s => { if (!s) return ""; const d = parse(s); return isNaN(d) ? s : `${d.getMonth()+1}.${d.getDate()} (${DOW[d.getDay()]})`; };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const safeUrl = u => /^https?:\/\//i.test(String(u||"").trim()) ? String(u).trim() : "";
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k,v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };

const GROUP = {learner:"학습근로자", pre2:"예비 2학년", pre1:"예비 1학년", general:"일반학생"};
const GROUP_SHORT = {learner:"학습", pre2:"예비2", pre1:"예비1", general:"일반"};
const GRADE_GROUP = {1:"pre1", 2:"pre2", 3:"learner"};
const GROUP_GRADE = {pre1:1, pre2:2, learner:3};
const TARGET = {all:"전체", learner:"학습근로자", pre:"예비 전체", pre2:"예비 2학년", pre1:"예비 1학년", general:"일반학생"};
const KINDS = [
  {k:"OJT", label:"OJT(기업현장)", v:"--k-ojt"}, {k:"OFF", label:"OFF-JT(학교)", v:"--k-off"}, {k:"PRJ", label:"팀프로젝트", v:"--k-prj"},
  {k:"SCH", label:"학교수업", v:"--k-sch"}, {k:"EVAL", label:"평가", v:"--k-eval"}, {k:"EVT", label:"행사·기타", v:"--k-evt"},
  {k:"CT", label:"대회", v:"--k-prj"}, {k:"AFT", label:"방과후", v:"--k-aft"}, {k:"PER", label:"개인 일정", v:"--k-per"}];
const kind = k => KINDS.find(x => x.k === k) || KINDS[5];
const REQ_CATS = ["상담","서류·증명","OJT·기업 문의","출결·조퇴","건의","기타"];
const REQ_STATUS = ["접수","처리중","완료"];
const PUR_CLS = {요청:"pre", 검토:"pre", 구매중:"learner", 구매완료:"ok", 중지:"bad"};

let cred = null, D = null, tab = lsGet("dj.tab") || "today", busy = 0;

let calMonth = new Date(); calMonth.setDate(1);
let anonOpen = null, anonFilter = 'all';
let matCategory="all",matSort="latest";
const ANON_GROUPS = {pre:'예비 도제반',after:'방과후',learner:'학습근로자'};
const anonGroupLabel = category => ANON_GROUPS[category] || '공통';
/* 예전 화면 구분의 저장 키는 보존합니다. 상단 메뉴는 이 값으로 바꾸지 않습니다. */

const isLearner = () => !T() && myGroup() === "learner";
let calSel = TODAY, schedMode = "cal", aftWeek = null, showPersonal = true, reqOpen = null, reqFilter = "active", openReaders = new Set(), armed = null, armT;
const T = () => D && D.me.role === "teacher";
const myGroup = () => D && D.me.group || "";
const matches = (t, g) => !t || t === "all" || t === g || (t === "pre" && (g === "pre1" || g === "pre2"));

/* ---------- 서버 호출 ---------- */
let toastT;
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }
function setBusy(d){ busy += d; $("#loading").hidden = busy <= 0; }
function callRaw(action, payload, c, withLoad){
  setBusy(1);
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(r => { setBusy(-1); if (r && r.ok) res(r); else rej(new Error(r && r.error || "응답이 없습니다")); })
      .withFailureHandler(e => { setBusy(-1); rej(new Error("연결이 끊겼습니다. 잠시 후 다시 시도해 주세요.")); })
      .api({ action, payload: payload || {}, cred: c || cred, withLoad: !!withLoad });
  });
}
const call = (action, payload, c) => callRaw(action, payload, c).then(r => r.data);
function setData(d){ if(!D)tab="today"; D = d; TODAY = D.today || TODAY; showUpdated(); render(); }
function showUpdated(){ const el = $("#updAt"), u = D && D.lastUpdate; if (!el) return; if (!u || !u.at){ el.hidden = true; return; } const day = u.at.slice(0,10), hm = u.at.slice(11,16); el.textContent = "최근 업데이트 " + (day === TODAY ? "오늘" : Number(day.slice(5,7)) + "." + Number(day.slice(8,10))) + (hm ? " " + hm : "") + (u.what ? " · " + u.what : ""); el.hidden = false; }
async function reload(){ try { setData(await call("load")); } catch (e) { if (/PIN|비밀번호|이름/.test(e.message)) { logout(e.message); } else toast(e.message); } }
async function act(action, payload, msg){
  try { const r = await callRaw(action, payload, null, true); if (msg) toast(msg); if (r.load) setData(r.load); else await reload(); return true; }
  catch (e) { toast(e.message); return false; }
}

/* ---------- 로그인 ---------- */
function gate(msg){
  $("#shell").hidden = true; $("#gate").hidden = false;
  const mode = lsGet("dj.mode") || "student";
  $("#gate").innerHTML = `<div class="gate"><div class="mark" aria-hidden="true">도</div><h1>도제반 알림판</h1><p>경기항공고 로봇자동화과 · 전자기기생산 L2 도제</p>
    ${msg ? `<div class="banner">${esc(msg)}</div>` : ""}
    <div class="row">${[["student","학생"],["teacher","선생님"]].map(([k,l]) => `<button class="chipbtn" data-mode="${k}" aria-pressed="${mode===k}">${l}</button>`).join("")}</div>
    <form id="loginForm" class="panel pad" style="display:flex;flex-direction:column;gap:12px">
      ${mode === "student" ? `
        <label class="fld"><span>이름</span><input type="text" id="lg-name" autocomplete="name" required maxlength="30" value="${esc(lsGet("dj.name") || "")}"></label>
        <label class="fld"><span>PIN (선생님께 받은 4자리)</span><input type="password" id="lg-pin" inputmode="numeric" autocomplete="current-password" required maxlength="8"></label>`
      : `<label class="fld"><span>선생님 비밀번호</span><input type="password" id="lg-pw" autocomplete="current-password" required></label>`}
      <label class="check"><input type="checkbox" id="lg-keep"> 이 기기에서 로그인 유지</label>
      <button class="btn pri" type="submit">들어가기</button>
    </form>
    <p style="font-size:13px">PIN을 모르면 선생님께 물어보세요. 홈 화면에 추가하면 앱처럼 열 수 있습니다.</p></div>`;
  $("#gate").querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { lsSet("dj.mode", b.dataset.mode); gate(); });
  $("#loginForm").onsubmit = async e => {
    e.preventDefault();
    const c = mode === "student" ? { name: $("#lg-name").value.trim(), pin: $("#lg-pin").value.trim() } : { teacher: $("#lg-pw").value };
    try {
      const data = await call("load", {}, c);
      cred = c;
      if ($("#lg-keep").checked) lsSet("dj.cred", JSON.stringify(c)); else lsSet("dj.cred", null);
      if (c.name) lsSet("dj.name", c.name);
      $("#gate").hidden = true; $("#shell").hidden = false;
      setData(data);
    } catch (err) { gate(err.message); }
  };
}
function logout(msg){ if (D && D.loginDisabled) return reload(); cred = null; D = null; lsSet("dj.cred", null); gate(msg); }
$("#logoutTop").onclick = () => logout();

/* ---------- 탭 ---------- */
const LEARNER_TABS = [['training','도제훈련'],['ojtcalendar','OJT 시간표'],['attendance','훈련 출결'],['units','능력단위']];
let learnerTab = LEARNER_TABS.some(([k]) => k === lsGet('dj.learnerTab')) ? lsGet('dj.learnerTab') : 'training';
function isLearnerTab(k){ return LEARNER_TABS.some(([key]) => key === k); }
function tabsFor(){
  let t;
  if (T()) t = [["today","오늘"],["notices","공지"],["learner","학습근로자"],["schedule","일정"],["purchases","구매요청"],["anon","익명게시판(수정요청포함)"],["portfolio","포트폴리오"],["roster","명단"],["me","설정"]];
  else if (isLearner()) t = [["today","오늘"],["notices","공지"],["learner","학습근로자"],["schedule","일정"],["anon","익명게시판(수정요청포함)"],["portfolio","포트폴리오"]].concat([["me","내 정보"]]);
  else t = [["today","오늘"],["notices","공지"],["schedule","일정"],["anon","익명게시판(수정요청포함)"],["purchases","구매요청"],["portfolio","포트폴리오"],["me","내 정보"]];
  t.splice(t.findIndex(([k])=>k==="portfolio"),0,["projects","프로젝트"],["contest","대회"],["cert","자격증"],["company","기업정보"]);
  const si = t.findIndex(x => x[0] === "schedule"); t.splice(si < 0 ? 1 : si + 1, 0, ["school", "시간표·급식"]);
  return t;
}
function go(k){
  if (k === 'requests') k = 'anon';
  if (k === 'board') { projSub = 'board'; k = 'projects'; }
  if (k === 'attendance' && !T() && !isLearner()) { schedMode = 'attendance'; k = 'schedule'; }
  if (k === 'learner') k = learnerTab;
  if (isLearnerTab(k) && tabsFor().some(([key]) => key === 'learner')) {
    learnerTab = k; lsSet('dj.learnerTab', k);
    if (k === 'attendance') prepareAttendanceScope('train');
  }
  tab = k; lsSet("dj.tab", k); reqOpen = null; anonOpen = null; render(); scrollTo({top:0}); }
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { boardOpen = null; go(b.dataset.tab); } });
document.querySelector("#shell .bar-top").addEventListener("click", e => { if (e.target.closest("[data-home]")) { boardOpen = null; go("today"); } });
document.querySelector("#shell .bar-top").addEventListener("keydown", e => { if (e.target.closest("[data-home]") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); boardOpen = null; go("today"); } });

/* ---------- 공통 조각 ---------- */
const emptyBox = (t, s) => `<div class="empty"><b>${esc(t)}</b>${s ? esc(s) : ""}</div>`;
const targetChip = t => !t || t === "all" ? `<span class="chip">전체</span>` : `<span class="chip ${t}">${esc(TARGET[t] || t)}</span>`;
const groupChip = g => `<span class="chip ${g}">${esc(GROUP[g] || g)}</span>`;
function afterCalendarEvents(){
  const out=[],common=new Map();
  D.afterschool.forEach(a=>{const g=GRADE_GROUP[a.grade];if(!T()&&(!D.me.afterschool||g!==myGroup()))return;
    const e={id:"aft"+a.date+a.grade+a.title,title:a.info?a.title:"방과후 "+a.title,kind:"AFT",date:a.date,time:a.info?"":a.start+"–"+a.end,target:g,srcLabel:"방과후 일정표 · "+a.grade+"학년"};
    if(!a.info){out.push(e);return;}
    const key=JSON.stringify([a.date,String(a.title||"").replace(/\s+/g,"")]);const prior=common.get(key);
    if(prior){if(!prior.targets.includes(g))prior.targets.push(g);if(!prior.grades.includes(a.grade))prior.grades.push(a.grade);prior.srcLabel="방과후 일정표 · "+prior.grades.slice().sort((a,b)=>a-b).join("·")+"학년";}
    else{e.targets=[g];e.grades=[a.grade];common.set(key,e);out.push(e);}
  });return out;
}
function sheetCalendarEvents(){return (D.sheetCalendar||[]).map(e=>({...e,src:'sheet',target:'all',targets:(e.grades||[]).map(g=>GRADE_GROUP[g]),srcLabel:'일정표 · 일반 일정'+(e.grades?.length?' · '+e.grades.slice().sort().join('·')+'학년':'')}));}

/* ---------- 대회 정보: 다가오는 대회를 오늘 화면과 프로젝트 메뉴에 바로 보이게 ---------- */
function dday(d){ const n = Math.round((parse(d) - parse(TODAY)) / 86400000); return n === 0 ? "D-day" : n > 0 ? "D-" + n : "D+" + (-n); }
function contestNext(p){
  const steps = [["접수 시작", p.applyStart], ["접수 마감", p.applyEnd], ["개최", p.date], ["대회 종료", p.eventEnd]].filter(x => x[1] && x[1] >= TODAY && !(x[0] === "접수 시작" && p.applyStart === p.applyEnd));
  return steps.sort((a, b) => a[1].localeCompare(b[1]))[0] || null;
}
function upcomingContests(){ return (D.boardPosts || []).filter(p => p.category === "대회").map(p => ({ p, next: contestNext(p) })).filter(x => x.next).sort((a, b) => a.next[1].localeCompare(b.next[1])); }
function contestCard(x){
  const p = x.p, n = x.next;
  return `<div class="row" style="border-top:1px solid var(--line);padding:10px 0;align-items:flex-start"><span class="chip ${n[0] === "접수 마감" ? "bad" : "pre"}" style="min-width:58px;text-align:center">${dday(n[1])}</span><div style="flex:1;min-width:0"><b style="overflow-wrap:anywhere">${esc(p.subject || p.title)}</b><div class="ev-s">${esc(n[0])} ${esc(fmtMD(n[1]))}${p.applyEnd && n[0] !== "접수 마감" && p.applyEnd >= TODAY ? " · 접수 마감 " + esc(fmtMD(p.applyEnd)) : ""}${p.date && n[0] !== "개최" ? " · 개최 " + esc(fmtMD(p.date)) : ""}${p.organizer ? " · " + esc(p.organizer) : ""}</div></div><button class="btn sm" data-contest-post="${esc(p.id)}">자세히</button></div>`;
}
function todayContests(){
  const list = upcomingContests().slice(0, 3); if (!list.length) return "";
  return `<section class="panel pad"><div class="row"><h3 style="margin:0">다가오는 대회</h3><span class="spacer"></span><button class="btn sm ghost" data-go-contests>전체 보기</button></div>${list.map(contestCard).join("")}</section>`;
}
function vContests(){
  const up = upcomingContests(), ids = new Set(up.map(x => x.p.id)), past = (D.boardPosts || []).filter(p => p.category === "대회" && !ids.has(p.id));
  return extraHead("대회 정보", "참가할 수 있는 대회와 접수·개최 일정입니다. 일정은 달력과 휴대폰 캘린더에도 자동으로 들어갑니다.", '<button class="btn pri" data-contest-new>+ 대회 등록</button>')
    + `<section class="panel pad">${up.length ? up.map(contestCard).join("") : '<div class="ev-s">예정된 대회가 없습니다. 알고 있는 대회가 있으면 등록해 주세요.</div>'}</section>`
    + (past.length ? `<details class="panel pad"><summary>지난 대회 ${past.length}건</summary>${past.map(p => `<div class="row" style="border-top:1px solid var(--line);padding:8px 0"><span style="flex:1;min-width:0;overflow-wrap:anywhere">${esc(p.subject || p.title)} <span class="ev-s">${esc(p.date ? fmtMD(p.date) : "")}</span></span><button class="btn sm ghost" data-contest-post="${esc(p.id)}">보기</button></div>`).join("")}</details>` : "");

let materialsUploading=false;
function driveDropBox(){if(!T())return '';return '<section class="panel pad"><div class="row">'+sel('파일 공개 대상','dropTarget',Object.entries(TARGET),'all').replace('name="dropTarget"','id="dropTarget"')+'</div><div id="materialsDrop" tabindex="0" role="button" aria-label="자료실 파일 선택 또는 끌어놓기" style="margin-top:12px;border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;cursor:pointer"><b>파일을 여기로 끌어다 놓으세요</b><p class="ev-s">또는 눌러서 선택 · 여러 파일 가능 · 파일당 '+MAX_MB+'MB</p><input type="file" id="materialsFiles" multiple hidden></div><p id="materialsUploadStatus" class="ev-s" role="status" aria-live="polite"></p></section>';}
function materialsFolderDlg(){openDlg('자료실 Drive 연결',field('자료실 폴더 주소','url',D.settings?.materialFolderUrl||'','url','required placeholder="Drive 폴더 주소를 붙여넣으세요"')+'<p class="ev-s">알림판을 배포한 구글 계정이 편집할 수 있는 폴더를 선택하세요. 파일을 끌어다 놓으면 이 폴더에 저장됩니다.</p>','연결',fd=>act('saveMaterialsFolder',fd,'자료실 Drive 폴더를 연결했습니다'));}
async function uploadMaterialsFiles(files){
  if(!T()||materialsUploading)return;const list=Array.from(files||[]);if(!list.length)return;if(list.length>20)return toast('한 번에 20개 이하로 올려 주세요');
  const target=$('#dropTarget')?.value||'all';materialsUploading=true;let uploaded=0,errors=[];
  try{for(const file of list){const status=$('#materialsUploadStatus');if(status)status.textContent='업로드 중 '+(uploaded+errors.length+1)+' / '+list.length+' · '+file.name;
    try{if(!file.size||file.size>MAX_MB*1024*1024)throw new Error('파일 크기는 0바이트 초과, '+MAX_MB+'MB 이하여야 합니다');
      const upload=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:file.name,base64:String(r.result).split(',')[1]});r.onerror=()=>reject(new Error('파일 읽기 실패'));r.readAsDataURL(file);});
      await call('uploadDriveMaterial',{target,upload});uploaded++;
    }catch(e){errors.push(file.name+': '+e.message);}
  }}finally{materialsUploading=false;await reload();const status=$('#materialsUploadStatus');if(status)status.textContent=uploaded+'개 업로드 완료'+(errors.length?' · 실패 '+errors.length+'개: '+errors.join(' / '):'');toast(uploaded+'개 업로드 완료'+(errors.length?' · 일부 파일 실패':''));}
}

$('#main').addEventListener('keydown',e=>{if(e.target.id==='materialsDrop'&&['Enter',' '].includes(e.key)){e.preventDefault();$('#materialsFiles')?.click();}});

$('#main').addEventListener('dragleave',e=>{const drop=e.target.closest('#materialsDrop');if(drop)drop.style.borderColor='var(--line)';});
$('#main').addEventListener('drop',e=>{const drop=e.target.closest('#materialsDrop');if(drop){e.preventDefault();drop.style.borderColor='var(--line)';uploadMaterialsFiles(e.dataTransfer.files);}});

let draftFiles = [], draftMax = 5, dlgDrop = null;
function filePicker(max, note){
  draftFiles = []; draftMax = max || 1;
  return `<div class="panel pad dropzone" id="dropZone" tabindex="0" role="button" aria-label="파일 선택 또는 끌어놓기" style="border:2px dashed var(--line);margin:12px 0;text-align:center;cursor:pointer"><b>파일을 끌어다 놓거나 눌러서 선택</b><div class="ev-s">${draftMax > 1 ? `최대 ${draftMax}개 · ` : ""}파일당 ${MAX_MB}MB${note ? " · " + esc(note) : ""}</div><input type="file" id="pickFiles" ${draftMax > 1 ? "multiple" : ""} accept="${FILE_ACCEPT}" hidden></div><div id="pickList"></div>`;
}
function addDraftFiles(list){
  const add = Array.from(list || []);
  for (const f of add) {
    if (!f.size || f.size > MAX_MB * 1024 * 1024) { toast(f.name + ": 파일당 " + MAX_MB + "MB 이하만 올릴 수 있습니다"); continue; }
    if (draftMax === 1) draftFiles = [f];
    else if (draftFiles.some(x => x.name === f.name && x.size === f.size)) continue;
    else if (draftFiles.length >= draftMax) { toast("한 번에 최대 " + draftMax + "개까지 올릴 수 있습니다"); break; }
    else draftFiles.push(f);
  }
  renderDraftFiles();
}
function renderDraftFiles(){
  const box = form.querySelector("#pickList"); if (!box) return;
  box.innerHTML = draftFiles.map((f, i) => `<div class="row" style="border-top:1px solid var(--line);padding:6px 0"><span style="flex:1;min-width:0;overflow-wrap:anywhere">${esc(f.name)} <span class="ev-s">${fmtSize(f.size)}</span></span><button type="button" class="btn sm ghost" data-unpick="${i}" aria-label="${esc(f.name)} 빼기">×</button></div>`).join("");
}
function bindFilePicker(){
  const zone = form.querySelector("#dropZone"), input = form.querySelector("#pickFiles"); if (!zone) return;
  zone.onclick = () => input.click();
  zone.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } };
  input.onchange = () => { addDraftFiles(input.files); input.value = ""; };
  dlgDrop = addDraftFiles;
}
const fileToUpload = f => new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve({ name: f.name, base64: String(r.result).split(",")[1] }); r.onerror = () => reject(new Error(f.name + " 파일을 읽지 못했습니다")); r.readAsDataURL(f); });
async function readDraftUploads(maxTotalMB){ let total = 0; for (const f of draftFiles) total += f.size; if (maxTotalMB && total > maxTotalMB * 1024 * 1024) throw new Error("첨부 합계를 " + maxTotalMB + "MB 이하로 줄여 주세요"); const out = []; for (const f of draftFiles) out.push(await fileToUpload(f)); return out; }
async function readUpload(){
  const file=draftFiles[0]||$('#extraFile')?.files[0]; if(!file)return null;
  if(file.size>MAX_MB*1024*1024)throw new Error(`첨부파일은 ${MAX_MB}MB 이하로 줄여 주세요. 큰 영상은 Drive 링크로 넣어 주세요`);
  return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,base64:String(reader.result).split(',')[1]});reader.onerror=()=>reject(new Error('파일을 읽지 못했습니다'));reader.readAsDataURL(file);});
}

function driveBox(){
  const s = D.settings || {}, list = (D.driveMaterials || []).filter(f => !f.error), err = (D.driveMaterials || []).find(f => f.error);
  if (!list.length && !err && !T()) return "";
  const shown = sortedMaterials(list.filter(f=>materialMatches(f.name,"",f.category||"기본")),"name","updated");
  const groups = {}; shown.forEach(f => { (groups[f.category || "기본"] = groups[f.category || "기본"] || []).push(f); });
  const head = `<div class="pad row" style="padding-bottom:4px"><span class="label">구글 드라이브 자료</span><span class="ev-s">${list.length}개</span><span class="spacer"></span>${T() && s.materialFolderUrl ? `<a class="btn sm ghost" href="${esc(s.materialFolderUrl)}" target="_blank" rel="noopener">Drive 폴더 열기 ↗</a>` : ""}${T() ? `<button class="btn sm ghost" data-links-refresh>새로고침</button>` : ""}</div>`;
  if (err) return `<section class="panel">${head}<div class="pad ev-s">${esc(err.error)}</div></section>`;
  if (!list.length) return `<section class="panel">${head}${emptyBox(s.materialFolder ? "폴더에 파일이 없습니다" : "자료실 드라이브 폴더가 연결되지 않았습니다", s.materialFolder ? "폴더에 파일을 넣으면 10분 안에 보입니다 (새로고침하면 바로)." : "자료실의 ‘Drive 연결 설정’ 버튼으로 폴더를 연결하거나, 파일을 끌어다 놓아 새 자료실 폴더를 만드세요.")}</section>`;
  return `<section class="panel">${head}
    ${Object.entries(groups).map(([g, fs]) => `<div class="pad" style="padding-bottom:0"><b>${esc(g)}</b></div>${fs.map(f => `<div class="row" style="padding:8px 16px;border-top:1px solid var(--line)"><div style="flex:1;min-width:0"><div style="overflow-wrap:anywhere">${esc(f.name)}</div><div class="ev-s">${esc(MIME_LABEL(f.mime))}${f.size ? " · " + fmtSize(f.size) : ""} · ${esc(f.updated)}${T() ? " · " + esc(TARGET[f.target] || "전체") : ""}</div></div><button class="btn sm" data-dfile="${esc(f.id)}">받기</button>${driveLink(f.id)}</div>`).join("")}`).join("")}</section>`;
}

async function downloadDrive(id){
  try{const f=await call('driveMaterialFile',{id});const bytes=Uint8Array.from(atob(f.base64),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:f.mime}));const a=document.createElement('a');a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}catch(e){toast(e.message);}
}

function arm(t, key){ if (armed !== key){ armed = key; t.classList.add("armed"); t.textContent = "삭제 확인"; clearTimeout(armT); armT = setTimeout(() => { armed = null; render(); }, 3000); return false; } armed = null; return true; }
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); toast("복사했습니다"); }
  catch { openDlg("아래 내용을 복사하세요", `<textarea id="f-copy" style="min-height:240px" readonly>${esc(txt)}</textarea>`, "닫기", () => {}); const t = $("#f-copy"); if (t){ t.focus(); t.select(); } }
}
$("#main").addEventListener("click", e => {
  const t = e.target.closest("button,[data-day]"); if (!t) return;
  const d = t.dataset;
  if (d.go) return go(d.go);
  if (d.ttWeek !== undefined){ schWeek = addDays(schoolMon(), 7 * Number(d.ttWeek)); if (d.ttWeek === "0") schWeek = null; return render(); }
  if (d.ttRetry !== undefined){ ttCache.delete(d.ttRetry); mealDone.delete(d.ttRetry.split("|")[0]); return render(); }
  if (d.reload !== undefined) return reload();
  if (d.logout !== undefined) return logout();
  if (d.schedmode){ schedMode = d.schedmode; return render(); }
  if (d.aftweek !== undefined){ const v = Number(d.aftweek); aftWeek = v === 0 ? weekStart(TODAY) : addDays(aftWeek || weekStart(TODAY), v); return render(); }
  if (d.cal !== undefined){ const v = Number(d.cal); if (v === 0){ calMonth = new Date(); calMonth.setDate(1); calSel = TODAY; } else calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + v, 1); return render(); }
  if (d.day){ calSel = d.day; const dd = parse(d.day); if (dd.getMonth() !== calMonth.getMonth()){ calMonth = dd; calMonth.setDate(1); } return render(); }
  if (d.new) return ({ notice: () => noticeDlg(), event: () => eventDlg(), pevent: peventDlg, request: requestDlg, purchase: purchaseDlg, student: () => studentDlg() })[d.new]();
  if (d.editnotice) return noticeDlg(D.notices.find(n => n.id === d.editnotice));
  if (d.editev) return eventDlg(D.events.find(x => x.id === d.editev));
  if (d.editst) return studentDlg(D.roster.find(r => String(r.row) === d.editst));
  if (d.delst){ const st = D.roster.find(r => String(r.row) === d.delst); if (!st || !arm(t, "st" + d.delst)) return; return act("deleteStudent", { row: st.row, name: st.name }, st.name + " 학생을 명단에서 삭제했습니다 (훈련 기록은 남아 있습니다)"); }
  if (d.readers){ openReaders.has(d.readers) ? openReaders.delete(d.readers) : openReaders.add(d.readers); return render(); }
  if (d.ack) return act("ack", { id: d.ack }, "확인했습니다");
  if (d.del){ if (!arm(t, d.del)) return; const [tabName, id] = d.del.split("|"); return act("deleteRow", { tab: tabName, id }, "삭제했습니다"); }
  if (d.delpe){ if (!arm(t, "pe|" + d.delpe)) return; return act("delPersonal", { id: d.delpe }, "삭제했습니다"); }
  if (d.dfile) return downloadDrive(d.dfile);
  if (d.linksRefresh !== undefined) return act("refreshLinks", {}, "드라이브·노션 목록을 새로 읽었습니다");
  if (d.caladd){ const ev = evStore.get(d.caladd); if (ev) calAddDlg(ev); return; }
  if (d.icsMake !== undefined) return act("icsToken", {}, "구독 주소를 만들었습니다");
  if (d.icsReset !== undefined){ if (!arm(t, "icsreset")) return; return act("icsToken", { reset: true }, "새 주소로 바꿨습니다. 이전 구독은 더 이상 갱신되지 않습니다"); }
  if (d.icsCopy !== undefined) return copyText(D.appUrl + "?ics=" + D.icsToken);
  if (d.ojtMonth !== undefined){const n=Number(d.ojtMonth);ojtMonth=n===0?parse(TODAY.slice(0,7)+'-01'):new Date(ojtMonth.getFullYear(),ojtMonth.getMonth()+n,1);ojtSelected=n===0?TODAY:ymd(ojtMonth);return render();}
  if (d.ojtDay){ojtSelected=d.ojtDay;ojtMonth=parse(d.ojtDay.slice(0,7)+'-01');return render();}
  if (d.ojtNew !== undefined && T())return eventDlg({kind:'OJT',target:'learner',date:ojtSelected});
  if (d.notionEdit !== undefined)return notionPortfolioDlg(d.notionEdit);
  if (d.materialsConnect !== undefined && T())return materialsFolderDlg();
  if (d.learnerTab && LEARNER_TABS.some(([k]) => k === d.learnerTab) && tabsFor().some(([k]) => k === 'learner')) return go(d.learnerTab);
  if (d.coNew !== undefined) return companyDlg();
  if (d.coEdit) return companyDlg(D.companies.find(c => c.id === d.coEdit));
  if (d.coDel){ if (!arm(t, "co|" + d.coDel)) return; return act("removeCompany", { id: d.coDel }, "기업을 지웠습니다"); }
  if (d.asEdit) return assignDlg(d.asEdit);
  if (d.trEvent !== undefined) return eventDlg({ kind: "OJT", target: "learner", date: TODAY });
  if (d.anonFilter) { anonFilter = d.anonFilter; anonOpen = null; return render(); }
  if (d.anonNew !== undefined) return anonDlg();
  if (d.anonOpen){ anonOpen = d.anonOpen; render(); scrollTo({top:0}); return; }
  if (d.anonBack !== undefined){ anonOpen = null; return render(); }
  if (d.anonDel){ if (!arm(t, d.anonDel)) return; const [kind, id] = d.anonDel.split("|"); if (kind === "post") anonOpen = null; return act("anonDelete", { kind, id }, "삭제했습니다"); }
  if (d.anonHide){ const [kind, id, h] = d.anonHide.split("|"); return act("anonHide", { kind, id, hidden: h === "1" }, h === "1" ? "숨겼습니다" : "다시 보이게 했습니다"); }
  if (d.reqfilter){ reqFilter = d.reqfilter; return render(); }
  if (d.reqback !== undefined){ reqOpen = null; return render(); }
  if (d.reqopen){ reqOpen = d.reqopen; render(); scrollTo({top:0}); const r = D.requests.find(x => x.id === reqOpen); if (r && (T() ? r.unreadTeacher : r.unreadStudent)) call("markRead", { id: r.id }).then(reload).catch(() => {}); return; }
  if (d.status && reqOpen) return act("setStatus", { id: reqOpen, status: d.status }, `‘${d.status}’(으)로 바꿨습니다`);
  if (d.makepins !== undefined) return call("makePins").then(n => { toast(n ? `${n}명에게 PIN을 만들었습니다` : "PIN이 빈 학생이 없습니다"); return reload(); }).catch(err => toast(err.message));
  if (d.copypins !== undefined) return copyText(D.roster.filter(r => r.pin).map(r => `${r.name}\t${r.pin}`).join("\n"));
});
$("#main").addEventListener("change", e => { if (e.target.id === "showPersonal"){ showPersonal = e.target.checked; render(); } if (e.target.id === "ttGrade" || e.target.id === "ttCls"){ if (e.target.id === "ttGrade") ttGrade = e.target.value; else ttCls = e.target.value; lsSet("dj.tt", ttGrade + "-" + ttCls); render(); } });
$("#main").addEventListener("input", e => { if (e.target.id === "matQ"){ matQ = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#matQ"); if (el){ el.focus(); el.setSelectionRange(pos, pos); } } });

});
