<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="dj-build" content="">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도제반 알림판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"></noscript>
<style>
/* Layout: 상단 고정 앱바 + 탭, 아래 단일 컬럼 작업 영역(최대 960px). 실습실 작업지시서 느낌의 차분한 청회색 + 안전주황 포인트 */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#e9edf1; --line:#d6dde4;
  --ink:#16202b; --muted:#5b6876; --accent:#d4561c; --accent-ink:#ffffff; --brand:#1f3a52;
  --ok:#1d7a52; --ok-bg:#e2f3ea; --warn:#a86400; --warn-bg:#fbefd9; --bad:#b4322e; --bad-bg:#f9e3e1; --info:#2c5d9a; --info-bg:#e3ecf8;
  --k-ojt:#1b7f86; --k-off:#4b4fb0; --k-sch:#5a6878; --k-eval:#b07400; --k-evt:#2865a8; --k-prj:#6a7d12; --k-aft:#2f7d4f; --k-per:#7751a8; --p1:#7a4bb0; --p1-bg:#efe6f8;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --sunk:#222c37; --line:#2e3a47;
  --ink:#e6ebf0; --muted:#9aa8b6; --accent:#f07a3e; --accent-ink:#1a0d05; --brand:#8fb4d6;
  --ok:#5fd19b; --ok-bg:#163327; --warn:#f0b65a; --warn-bg:#3a2c12; --bad:#f08a84; --bad-bg:#3b1d1c; --info:#8bb5ec; --info-bg:#1b2a40;
  --k-ojt:#4fc4cc; --k-off:#9a9ef0; --k-sch:#9aa8b6; --k-eval:#f0b65a; --k-evt:#83b8f1; --k-prj:#b8cc5a; --k-aft:#6fd39a; --k-per:#c3a0ed; --p1:#c9a6f0; --p1-bg:#2d2240; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#222c37; --line:#2e3a47;
  --ink:#e6ebf0; --muted:#9aa8b6; --accent:#f07a3e; --accent-ink:#1a0d05; --brand:#8fb4d6;
  --ok:#5fd19b; --ok-bg:#163327; --warn:#f0b65a; --warn-bg:#3a2c12; --bad:#f08a84; --bad-bg:#3b1d1c; --info:#8bb5ec; --info-bg:#1b2a40;
  --k-ojt:#4fc4cc; --k-off:#9a9ef0; --k-sch:#9aa8b6; --k-eval:#f0b65a; --k-evt:#83b8f1; --k-prj:#b8cc5a; --k-aft:#6fd39a; --k-per:#c3a0ed; --p1:#c9a6f0; --p1-bg:#2d2240; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:960px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.bar-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{width:34px;height:34px;border-radius:8px;background:var(--brand);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.ttl{min-width:160px;flex:1}
.ttl h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
.ttl p{margin:0;font-size:12.5px;color:var(--muted)}
.ttl .upd{font-size:11px;opacity:.85}
[data-home]{cursor:pointer}
.role{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.role.t{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;flex-wrap:wrap;gap:2px;overflow:visible;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:9px 12px 11px;font-size:14.5px;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .ti{display:none}
.tab .tl-short{display:none}
#tabs.icons .tab .ti{display:inline;margin-right:4px}
.look-row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.swatch[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.emoji-pick{font-size:22px;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.emoji-pick[aria-pressed="true"]{border:2px solid var(--accent);background:var(--sunk)}
.mark.emoji{background:var(--sunk);font-size:21px}
html.big body{font-size:16.5px}
@media (max-width:640px){
  #tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:0;overflow:visible;margin:0 -6px;padding-bottom:2px}
  #tabs .tab{padding:9px 1px 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;border-bottom-width:2px;letter-spacing:-.02em}
  #tabs .tab .tl-long{display:none}
  #tabs .tab .tl-short{display:block;max-width:100%;white-space:normal;overflow-wrap:anywhere}
  #tabs.icons .tab .ti{display:block;font-size:18px;line-height:1.15;margin:0}
}

.tab:focus-visible,.btn:focus-visible,.chipbtn:focus-visible,.st:focus-visible,.cal-day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.nav-context{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.hub-nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
main{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:19px;font-weight:700}
.sec-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid2>*{min-width:0}
.label{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:600;text-transform:uppercase}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.learner{background:var(--info-bg);color:var(--info)}
.chip.pre,.chip.pre2{background:var(--warn-bg);color:var(--warn)}
.chip.pre1{background:var(--p1-bg);color:var(--p1)}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin:0 4px 4px 0}
.src{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;font-size:11px;font-weight:700;flex:none;background:var(--sunk);color:var(--muted)}
.src.drive{background:#e4f1e6;color:#1e7a3a}.src.notion{background:var(--ink);color:var(--surface)}
.mat{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.mat:last-child{border-bottom:0}.mat>div{min-width:0;flex:1}
.mat a.open{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap}
.mat a.open:hover{text-decoration:underline}
a.lnk{color:var(--info);overflow-wrap:anywhere}
.team{display:flex;flex-direction:column}
.team-h{padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.team-h h3{font-size:16px;font-weight:700}
.ms{display:grid;grid-template-columns:24px 92px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);font-size:14px}
.ms:last-child{border-bottom:0}
.ms.done .t{color:var(--muted);text-decoration:line-through}
.dday{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dday.soon{color:var(--accent);font-weight:600}
.pf-card{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.pf-card:hover{border-color:var(--accent)}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.entry{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.entry:last-child{border-bottom:0}
.entry h3{font-size:16px;font-weight:600}
.entry .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.entry p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch}
.fb{background:var(--info-bg);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px}
.fb b{color:var(--info);font-size:12.5px}
.pf-hero{padding:18px 16px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.pf-hero h3{font-size:20px;font-weight:700}
.chip.pin{background:var(--accent);color:var(--accent-ink)}
.kdot{width:8px;height:8px;border-radius:2px;flex:none;display:inline-block}

/* notices */
.notice{padding:16px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.notice:last-child{border-bottom:0}
.notice h3{font-size:16px;font-weight:600}
.notice .body,.board-body{white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch}
.board-body{line-height:1.85;margin:20px 0;font-size:15px}
.notice .meta{font-size:12.5px;color:var(--muted)}
.ack-ok{font-size:13px;color:var(--ok);font-weight:600}
.readers{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px}

/* events */
.ev{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:start}
.ev:last-child{border-bottom:0}
.ev-date{font-family:var(--f-mono);font-size:13px;line-height:1.25;color:var(--muted)}
.ev-date b{display:block;font-size:20px;color:var(--ink);font-weight:500}
.ev-t{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev-s{font-size:13px;color:var(--muted)}
.ev>div{min-width:0}

.cal-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cal-head h3{font-size:16px;font-weight:600;min-width:7.5em;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow{font-size:12px;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.cal-dow.sun{color:var(--bad)}.cal-dow.sat{color:var(--muted)}
.cal-day{appearance:none;border:0;background:none;text-align:left;min-height:78px;padding:5px 5px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-day:nth-child(7n){border-right:0}
.cal-day.out{background:var(--sunk);opacity:.6}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-day .d{font-family:var(--f-mono);font-size:12.5px;color:var(--ink)}
.cal-day.holiday .d{color:var(--bad)}
.cal-day.holiday.today .d{background:var(--bad);color:var(--surface)}
.cal-day.today .d{background:var(--ink);color:var(--surface);border-radius:4px;padding:0 4px;align-self:flex-start}
.cal-ev{font-size:11px;line-height:1.3;padding:1px 4px;border-radius:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-more{font-size:11px;color:var(--muted)}
@media (max-width:560px){.cal-day{min-height:54px}.cal-ev{font-size:0;height:5px;padding:0}.cal-more{display:none}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--f-mono);font-size:24px;font-weight:500;line-height:1.2}
.stat .k{font-size:12.5px;color:var(--muted)}

/* attendance */
.att{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.attHours{width:105px;min-width:0}.attNote{max-width:200px;min-width:0}@media(max-width:520px){.att .row{flex-wrap:wrap}.attNote{flex:1;max-width:100%}}
.att .who{min-width:0}
.att .who b{font-weight:600}
.att .who small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:nowrap}
.st{appearance:none;border:0;border-right:1px solid var(--line);background:var(--surface);padding:6px 9px;font-size:13px;cursor:pointer;color:var(--muted)}
.st:last-child{border-right:0}
.st[aria-pressed="true"].s-출석{background:var(--ok-bg);color:var(--ok);font-weight:600}
.st[aria-pressed="true"].s-지각,.st[aria-pressed="true"].s-조퇴{background:var(--warn-bg);color:var(--warn);font-weight:600}
.st[aria-pressed="true"].s-결석{background:var(--bad-bg);color:var(--bad);font-weight:600}
.st[aria-pressed="true"].s-공결{background:var(--info-bg);color:var(--info);font-weight:600}
@media (max-width:520px){.att{grid-template-columns:1fr}}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
th.vert{writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;max-height:9em;padding:8px 4px;font-weight:500}
.pbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;background:var(--ok)}
.rate-low{color:var(--bad);font-weight:600}

input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:13px;color:var(--muted);font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog.intro-guide{box-sizing:border-box;width:calc(100vw - 16px);max-width:980px}
.ig{--ig-paper:#fff;--ig-ink:#18201b;--ig-muted:#5b665f;--ig-line:#d8dfd9;--ig-mask:#1d6b4f;--ig-soft:#e3efe8;--ig-copper:#b5652b;--ig-weak:#9a3b2f;--ig-weak-soft:#f7e9e6;--ig-bg:#f3f5f2;--ig-display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
 display:grid;gap:28px;color:var(--ig-ink);background:var(--ig-bg);margin:-4px;padding:18px 16px 24px;border-radius:8px;font:15px/1.7 var(--f-body)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ig{--ig-paper:#18201b;--ig-ink:#e7ede8;--ig-muted:#9fb0a5;--ig-line:#2c3830;--ig-mask:#5fc49a;--ig-soft:#1d3329;--ig-copper:#e09a62;--ig-weak:#f09a8c;--ig-weak-soft:#3a201c;--ig-bg:#111612}}
:root[data-theme="dark"] .ig{--ig-paper:#18201b;--ig-ink:#e7ede8;--ig-muted:#9fb0a5;--ig-line:#2c3830;--ig-mask:#5fc49a;--ig-soft:#1d3329;--ig-copper:#e09a62;--ig-weak:#f09a8c;--ig-weak-soft:#3a201c;--ig-bg:#111612}
.ig h3,.ig h4,.ig h5{font-family:var(--ig-display);margin:0;line-height:1.3;text-wrap:balance}
.ig-top{display:grid;gap:8px}
.ig-tag{font:500 11.5px/1 var(--f-mono);letter-spacing:.08em;color:var(--ig-mask)}
.ig-top h3{font-size:clamp(21px,4vw,28px);font-weight:800}
.ig-lead{color:var(--ig-muted);max-width:68ch;margin:0}
.ig-ex{display:inline-block;font:600 12px/1 var(--f-body);background:var(--ig-weak-soft);color:var(--ig-weak);padding:5px 8px;border-radius:4px;width:max-content}
.ig-sheet{background:var(--ig-paper);border:1px solid var(--ig-line);border-radius:10px;overflow:hidden}
.ig-sh{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;padding:16px 20px;border-bottom:2px solid var(--ig-mask)}
.ig-sh .nm{font:800 22px/1.2 var(--ig-display)}
.ig-meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ig-muted);font-size:13.5px}
.ig-rev{margin-left:auto;font:500 11.5px/1 var(--f-mono);color:var(--ig-muted);letter-spacing:.06em}
.ig-headline{padding:18px 20px 4px;margin:0;font:700 clamp(17px,2.6vw,21px)/1.5 var(--ig-display);max-width:40ch}
.ig-chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 20px 16px}
.ig-chips span{font-size:12.5px;background:var(--ig-soft);color:var(--ig-mask);padding:4px 9px;border-radius:999px;font-weight:600}
.ig-grid{display:grid;grid-template-columns:1.25fr 1fr;border-top:1px solid var(--ig-line)}
.ig-grid>section{padding:16px 20px;min-width:0;display:grid;gap:10px;align-content:start}
.ig-grid>section+section{border-left:1px solid var(--ig-line)}
.ig-lb{font:500 11.5px/1.2 var(--f-mono);color:var(--ig-muted);letter-spacing:.06em}
.ig-photo{aspect-ratio:16/9;max-width:100%;border-radius:6px;background:var(--ig-soft);overflow:hidden}
.ig-photo canvas{width:100%;height:100%;display:block}
.ig-steps{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.ig-steps li{display:grid;grid-template-columns:72px 1fr;gap:10px;font-size:14.5px}
.ig-steps b{font:500 12px/1.9 var(--f-mono);color:var(--ig-copper)}

function gate(msg){
  navHistory=[];navAnchor='';
  $("#startupScreen").hidden=true;
  $("#shell").hidden = true; $("#gate").hidden = false;
  const mode = lsGet("dj.mode") || "student";
  $("#gate").innerHTML = `<div class="gate"><div class="mark" aria-hidden="true">도</div><h1>도제반 알림판</h1><p>경기항공고 로봇자동화과 · 전자기기생산 L2 도제</p>
    ${msg ? `<div class="banner">${esc(msg)}</div>` : ""}
    <div class="row">${[["student","학생"],["teacher","선생님"]].map(([k,l]) => `<button class="chipbtn" data-mode="${k}" aria-pressed="${mode===k}">${l}</button>`).join("")}</div>
    <form id="loginForm" class="panel pad" style="display:flex;flex-direction:column;gap:12px">
      ${mode === "student" ? `
        <label class="fld"><span>학번</span><input type="text" id="lg-name" inputmode="numeric" autocomplete="username" required maxlength="30" placeholder="예: 20313" value="${esc(lsGet("dj.student.id") || "")}"></label>
        <label class="fld"><span>비밀번호 (처음에는 학번)</span><input type="password" id="lg-pin" autocomplete="current-password" required maxlength="64"></label>`
      : `<label class="fld"><span>교사 이름</span><input type="text" id="lg-teacher-name" autocomplete="username" maxlength="30" value="${esc(lsGet("dj.teacher.name")||"")}"></label><label class="fld"><span>선생님 비밀번호</span><input type="password" id="lg-pw" autocomplete="current-password" required></label>`}
      <label class="check"><input type="checkbox" id="lg-keep"> 내 로그인 정보 저장 (이 기기)</label>
      <button class="btn pri" type="submit">들어가기</button>
    </form>
    ${lsGet("dj.login.required")==="false"||(D&&isGuest()&&D.guestView)?'<button class="btn ghost" type="button" id="guestBrowse">로그인 없이 둘러보기</button>':""}
    <p style="font-size:13px">1~3학년 3반 학생은 학번과 비밀번호로 로그인하세요. 초기 비밀번호는 학번(예: 20313)입니다. 홈 화면에 추가하면 앱처럼 열 수 있습니다.</p></div>`;
  if($("#guestBrowse"))$("#guestBrowse").onclick = () => enterGuest();
  $("#gate").querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { lsSet("dj.mode", b.dataset.mode); gate(); });
  $("#loginForm").onsubmit = async e => {
    e.preventDefault();
    const c = mode === "student" ? { name: $("#lg-name").value.trim(), pin: $("#lg-pin").value.trim() } : { teacherName:$("#lg-teacher-name").value.trim(),teacher: $("#lg-pw").value };
    try {
      const login=await call("login",{remember:$("#lg-keep").checked},c),authCred=login.session?{session:login.session}:c;
      const data = await call("load", {deferLinks:true,homeOnly:true}, authCred);
      cred = authCred;
      if ($("#lg-keep").checked) lsSet("dj.cred", JSON.stringify(cred)); else lsSet("dj.cred", null);
      try{if(cred.session)sessionStorage.setItem("dj.session",JSON.stringify(cred));else sessionStorage.removeItem("dj.session");}catch{}
      if (c.name) { lsSet("dj.name", data.me.name);if(data.me.studentId)lsSet("dj.student.id",data.me.studentId); }if(c.teacherName)lsSet("dj.teacher.name",c.teacherName);
      $("#gate").hidden = true; $("#shell").hidden = false;
      setData(data);
    } catch (err) { gate(err.message); }
  };
}
function logout(msg){ if(cred&&cred.session)call("logoutSession",{token:cred.session}).catch(()=>{});try{sessionStorage.removeItem("dj.session");}catch{}fullLoadEpoch++;fullLoadPending=null;fullLoadError=""; clearGlobalSearch(); todayDriveNews.clear();todayNewsOwner="";resourceLinkEpoch++;resourceLinkPending=null; if (D && D.loginDisabled) return reload(); const guestOk = Boolean(D && D.guestView); cred = null; D = null; noticeImages.clear(); noticeImagesPending.clear(); lsSet("dj.cred", null); lsSet(HOME_KEY, null); if (guestOk && !msg) return enterGuest(); gate(msg); }
$("#logoutTop").onclick = () => (isGuest()||isViewer()) ? gate() : logout();
/* 로그인 없이 둘러보기: 비어 있는 로그인 정보로 들어오면 서버가 '손님'으로 공개 자료만 보냅니다. */
async function enterGuest(){ try { const data = await call("load", {deferLinks:true,homeOnly:true}, {}); if (!data.me || data.me.role !== "guest" && !data.loginDisabled) throw new Error("로그인해 주세요"); cred = {}; $("#gate").hidden = true; $("#shell").hidden = false; tab = "today"; setData(data); } catch (e) { gate(e.message); } }

const LEARNER_TABS = [['training','도제훈련'],['ojtcalendar','OJT 시간표'],['attendance','훈련 출결'],['units','능력단위']];
let learnerTab = LEARNER_TABS.some(([k]) => k === lsGet('dj.learnerTab')) ? lsGet('dj.learnerTab') : 'training';
function isLearnerTab(k){ return LEARNER_TABS.some(([key]) => key === k); }
const NAV_LABELS={today:'오늘',notices:'공지·소통',schedule:'일정',projects:'프로젝트',contest:'대회·자격증',company:'진로',materials:'자료실',learner:'도제훈련',roster:'교사 관리'};
function rootOf(k){

 if(['notices','anon','requests'].includes(k))return 'notices';
 if(['schedule','school'].includes(k))return 'schedule';
 if(['projects','board','purchases','equipment'].includes(k))return 'projects';
 if(['contest','cert'].includes(k))return 'contest';
 if(['company','portfolio','intro'].includes(k))return 'company';
 if(['materials','photos','tools'].includes(k))return 'materials';
 if(k==='learner'||isLearnerTab(k))return 'learner';
 if(['roster','register'].includes(k)||k==='me'&&T())return 'roster';
 return k;
}
function baseTabs(){
 const keys=['today','notices','schedule','projects','contest','company','materials'];
 if(T()||isLearner())keys.push('learner');if(T())keys.push('roster');
 return keys.map(k=>[k,NAV_LABELS[k]]);
}
function tabsFor(){
 if(isGuest())return baseTabs();
 const t=baseTabs(),h=D&&D.myHome;if(!h)return t;
 const current=new Set(t.map(x=>x[0]));
 const hidden=new Set((h.hiddenTabs||[]).filter(k=>current.has(k)&&k!=='today'));
 const order=[...new Set((h.tabs||[]).map(rootOf))],pos=k=>order.includes(k)?order.indexOf(k):100+t.findIndex(x=>x[0]===k);
 return t.filter(([k])=>!hidden.has(k)).sort((a,b)=>pos(a[0])-pos(b[0]));
}
function routeAllowed(k){if(isGuest())return GUEST_TABS.includes(k);if(k==='me')return !isViewer();return baseTabs().some(([r])=>r===rootOf(k));}
let navHistory=[],navCaptured=false,navScroll=null,navAnchor='';
function navState(){return {tab,projSub,boardOpen,boardFilter,boardQuery,noticeOpen,noticeFilter,noticeQuery,companySub,companySelected,certSelected,certView,schedMode,calSel,calMonth:+calMonth,matQ,matCategory,matSort,anonOpen,anonFilter,learnerTab,scroll:scrollY};}
function pushNav(v=navState()){navHistory.push(v);if(navHistory.length>30)navHistory.shift();}
function backNav(){const v=navHistory.pop();if(!v)return;({tab,projSub,boardOpen,boardFilter,boardQuery,noticeOpen,noticeFilter,noticeQuery,companySub,companySelected,certSelected,certView,schedMode,calSel,matQ,matCategory,matSort,anonOpen,anonFilter,learnerTab}=v);calMonth=new Date(v.calMonth);navScroll=v.scroll;navAnchor='';lsSet('dj.tab',tab);render();}
function selectedRoute(){if(tab==='projects')return projSub||'overview';if(tab==='schedule')return schedMode==='aft'?'after':schedMode==='attendance'?'afterattendance':'schedule';return tab;}
function hubOptions(){return hubOptionsAll().filter(([k])=>!(isViewer()&&k==='me'));}
function hubOptionsAll(){
 const root=rootOf(tab);
 if(isGuest())return ({notices:[['notices','공지']],schedule:[['schedule','달력'],['after','방과후'],['school','시간표·급식']],projects:[['board','결과물 공유']],contest:[['contest','대회'],['cert','자격증']],company:[['company','기업 안내']],materials:[['materials','공통 자료'],['tools','무료 도구']]}[root]||[]);
 if(root==='notices')return [['notices','공지'],['anon','익명게시판']];
 if(root==='schedule')return [['schedule','달력'],['after','방과후 시간표'],['afterattendance',T()?'방과후 출결':'내 방과후 출결'],['school','시간표·급식']];
 if(root==='projects')return [['team',T()?'프로젝트 관리':'우리 팀'],['board','결과물 공유'],['purchases','구매요청'],['equipment','기자재 사용']];
 if(root==='contest')return [['contest','대회'],['cert','자격증']];
 if(root==='company')return [['company','기업 안내'],['portfolio','포트폴리오']];
 if(root==='materials')return [['materials','공통 자료'],['photos','사진첩'],['tools','무료 도구']];
 if(root==='learner')return LEARNER_TABS;
 if(root==='roster')return [['roster','학생 명단'],['register','통합 출석부'],['me','연동·계정 설정']];
 return [];
}
function navRoute(k){
 navHistory=[];
 if(k==='team'||k==='board'){projSub=k;boardOpen=null;if(k==='board'){boardQuery='';boardFilter='프로젝트';}return go('projects');}
 if(k==='after'||k==='afterattendance'){schedMode=k==='after'?'aft':'attendance';return go('schedule');}
 if(k==='schedule')schedMode='cal';
 if(k==='board'){boardQuery='';boardFilter='프로젝트';}
 if(k==='company'){companySelected='';companySub='info';}
 if(k==='contest')boardOpen=null;
 if(k==='cert'){boardOpen=null;certSelected='';certView='schedule';}
 if(k==='notices'){noticeOpen=null;noticeQuery='';noticeFilter='all';}
 go(k);
}
function navigationBar(){
 if(tab==='today'&&!navHistory.length)return '';
 const root=rootOf(tab),active=selectedRoute(),current=tab==='intro'?'portfolio':active;
 return '<div class="nav-context" aria-label="현재 위치">'+(navHistory.length?'<button class="btn sm ghost" data-nav-back>‹ 이전 화면</button>':'')+'<span>'+esc(NAV_LABELS[root]||'내 정보')+'</span><span aria-hidden="true">›</span><strong>'+esc(tab==='intro'?'포트폴리오 · 자기소개서':(hubOptions().find(([k])=>k===current)||[])[1]||(tab==='me'?'내 정보':'대표 화면'))+'</strong></div>'
 +'<nav class="hub-nav" aria-label="'+esc(NAV_LABELS[root]||'내 정보')+' 하위 메뉴">'+hubOptions().map(([k,l])=>'<button class="chipbtn" data-nav-route="'+k+'" '+(k==='after'?'data-schedmode="aft"':k==='afterattendance'?'data-schedmode="attendance"':k==='schedule'?'data-schedmode="cal"':isLearnerTab(k)?'data-learner-tab="'+k+'"':k==='team'||k==='board'?'data-projsub="'+k+'"':k==='register'?'data-go="register"':'')+' aria-pressed="'+(current===k)+'">'+esc(l)+'</button>').join('')+'</nav>';
}
function finishNav(){
 if(navScroll!==null){const y=navScroll;navScroll=null;requestAnimationFrame(()=>scrollTo(0,y));}
 if(navAnchor&&tab==='school'){requestAnimationFrame(()=>{const el=document.getElementById(navAnchor);if(el){const bar=document.querySelector('.bar').getBoundingClientRect().height;scrollTo(0,scrollY+el.getBoundingClientRect().top-bar-12);}});}
}
function go(k,options={}){
 if(k==='requests')k='anon';if(k==='board'){projSub='board';k='projects';}
 if(options.top){
  navHistory=[];boardOpen=null;noticeOpen=null;
  if(k==='notices'){noticeQuery='';noticeFilter='all';}
  if(k==='materials'){matQ='';matCategory='all';}
  if(k==='projects')projSub='overview';
  if(k==='company'){companySub='info';companySelected='';}
  if(k==='contest'){certSelected='';certView='schedule';}
  if(k==='schedule')schedMode='cal';
  if(k==='learner')learnerTab='training';
 }
 if(k==='projects'&&isGuest())projSub='board';
 if(k==='projects'&&projSub==='tools')k='tools';if(k==='projects'&&projSub==='materials')k='materials';
 if(k==='attendance'&&!T()&&!isLearner()){schedMode='attendance';k='schedule';}
 if(k==='learner')k=learnerTab;
 if(!routeAllowed(k)){gate('로그인하면 이 메뉴를 볼 수 있습니다.');return;}
 if(!options.top&&!navCaptured&&D&&k!==tab&&rootOf(k)!==rootOf(tab))pushNav();
 if(isLearnerTab(k)){learnerTab=k;lsSet('dj.learnerTab',k);if(k==='attendance')prepareAttendanceScope('train');}
 tab=k;navAnchor='';lsSet('dj.tab',k);reqOpen=null;anonOpen=null;render();scrollTo({top:0});
}

 if(x.boardOpen||x.companyOpen||x.certSelect||x.noticeOpen||x.noticeRelated||x.contestPost||x.certInfo){pushNav();navCaptured=true;queueMicrotask(()=>{navCaptured=false;});}
},true);

function paintGlobalSearch(){

function visitSearchResult(x){
  clearGlobalSearch();if(!D||!x)return;noticeOpen=null;boardOpen=null;
  if(x.route==="notice"){noticeOpen=x.id;go("notices");}
  else if(x.route==="event"){calSel=x.id;calMonth=parse(x.id);calMonth.setDate(1);schedMode="cal";go("schedule");}
  else if(x.route==="post"){const p=(D.boardPosts||[]).find(p=>p.id===x.id);projSub="board";boardOpen=x.id;go(p?.category==='대회'?'contest':p?.category==='자격증'?'cert':'projects');}
  else if(x.route==="anonPost"){go("anon");anonOpen=x.id;render();}
  else if(x.route==="project")openTodayTeam(x.id);
  else if(x.route==="material"){matQ=x.id;matCategory="all";go("materials");}
  else if(x.route==="certItem"){certSelected=x.id;certView="schedule";go("cert");}
  else if(x.route==="companyItem"){companySub="info";companySelected=x.id;go("company");}
  else if(x.route==="after"){schedMode="attendance";go("schedule");}

function dday(d){ const n = Math.round((parse(d) - parse(TODAY)) / 86400000); return n === 0 ? "D-day" : n > 0 ? "D-" + n : "D+" + (-n); }
function contestNext(p){
  const steps = [["접수 시작", p.applyStart], ["접수 마감", p.applyEnd], ["개최", p.date], ["대회 종료", p.eventEnd]].filter(x => x[1] && x[1] >= TODAY && !(x[0] === "접수 시작" && p.applyStart === p.applyEnd));
  return steps.sort((a, b) => a[1].localeCompare(b[1]))[0] || null;
}
function upcomingContests(){ return (D.boardPosts || []).filter(p => p.category === "대회").map(p => ({ p, next: contestNext(p) })).filter(x => x.next).sort((a, b) => a.next[1].localeCompare(b.next[1])); }
function contestCard(x){

function ojtDays(a, from, days){
  const out = []; if (!a || !a.ojtDays) return out;

  for (let i = 0; i < days; i++){ const s = addDays(from, i), d = parse(s);
    if (a.start && s < a.start) continue; if (a.end && s > a.end) continue;

  return out;
}

function evTimes(e){

    return ymdc(e.date) + "T" + pad(+a[1]) + a[2] + "00/" + ymdc(end) + "T" + pad(eh) + em + "00"; }

function attendanceSummary(scope){
 const month=T()&&tab==='register'?bookMonth:scope&&T()?attDate.slice(0,7):TODAY.slice(0,7), rec=(D.attendance||[]).filter(a=>a.date.slice(0,7)===month&&(!scope||(scope==='after'?/^방과후/.test(a.lesson):!/^방과후/.test(a.lesson))));
 const kinds=scope==='after'?['방과후']:scope==='train'?['OJT','OFF-JT','기타']:['OJT','OFF-JT','방과후','기타'];const klass=l=>/OFF/i.test(l)?'OFF-JT':/OJT/i.test(l)?'OJT':/^방과후/.test(l)?'방과후':'기타';

function attendanceStudentTotals(rec,scope){if(!T())return '';const names=[...new Set(rec.map(a=>a.name))].sort((a,b)=>a.localeCompare(b,'ko'));if(!names.length)return '';const cols=scope==='after'?['방과후']:scope==='train'?['OJT','OFF-JT']:['OJT','OFF-JT','방과후'];return '<details><summary>학생별 시간 합계</summary><div class="tbl-wrap"><table><thead><tr><th>학생</th>'+cols.map(k=>'<th>'+k+'</th>').join('')+'<th>시간 미입력</th></tr></thead><tbody>'+names.map(n=>{const rows=rec.filter(a=>a.name===n);const sum=k=>Number((rows.filter(a=>k==='OFF-JT'?/OFF/i.test(a.lesson):k==='OJT'?/OJT/i.test(a.lesson)&&!/OFF/i.test(a.lesson):/^방과후/.test(a.lesson)).reduce((s,a)=>s+(a.minutes==null?0:Number(a.minutes)),0)/60).toFixed(2));return '<tr><td>'+esc(n)+'</td>'+cols.map(k=>'<td>'+sum(k)+'시간</td>').join('')+'<td>'+rows.filter(a=>a.minutes==null).length+'건</td></tr>';}).join('')+'</tbody></table></div></details>';}

const TODAY_CARDS=[["todo","내 할 일·메모"],["notices","최근 공지"],["meal","오늘 급식"],["focus","확인할 일·요청 결과·팀 소식"],["events","오늘 일정·앞으로 2주"],["contests","다가오는 대회"],["details","활동 자료 불러오기"]];
const canMyHome=()=>Boolean(D&&D.myHome&&!isGuest()&&!D.loginDisabled);
function todayOrder(){
  const h=canMyHome()?D.myHome:null,order=h?h.cards||[]:[],hidden=new Set(h?h.hidden||[]:[]);
  const pos=k=>{const i=order.indexOf(k);return i<0?100+TODAY_CARDS.findIndex(c=>c[0]===k):i;};
  return TODAY_CARDS.map(c=>c[0]).filter(k=>!hidden.has(k)).sort((a,b)=>pos(a)-pos(b));
}
function todayTodo(){
  if(!canMyHome())return "";
  const h=D.myHome,todos=h.todos||[],open=todos.filter(t=>!t.d),done=todos.filter(t=>t.d);
  const row=t=>`<li class="todo-item${t.d?" done":""}"><label><input type="checkbox" data-todo-done="${esc(t.id)}" ${t.d?"checked":""}><span>${esc(t.t)}</span></label>${t.due?`<span class="ev-s${!t.d&&t.due<TODAY?" late":""}">${esc(fmtMD(t.due))}</span>`:""}<button class="btn sm ghost" data-todo-del="${esc(t.id)}" aria-label="${esc(t.t)} 지우기">×</button></li>`;
  return `<section class="panel pad my-todo"><div class="row"><span class="label">내 할 일·메모</span><span class="spacer"></span>${T()?"":'<button class="btn sm" data-today-pevent>+ 내 일정</button>'}</div>
    <form class="todo-add row" id="todoAdd"><input type="text" id="todoText" maxlength="200" placeholder="할 일을 적고 추가" aria-label="새 할 일"><input type="date" id="todoDue" aria-label="기한(선택)"><button class="btn sm pri" type="submit">추가</button></form>
    ${todos.length?`<ul class="todo-list">${open.map(row).join("")}${done.map(row).join("")}</ul>`:'<p class="ev-s">나만 보는 할 일 목록입니다. 다른 기기에서 로그인해도 그대로 보입니다.</p>'}
    <details class="todo-memo"${h.memo?" open":""}><summary>메모</summary><textarea id="todoMemo" maxlength="2000" rows="3" placeholder="나만 보는 메모">${esc(h.memo||"")}</textarea><div class="row"><span class="spacer"></span><button class="btn sm" type="button" data-memo-save>메모 저장</button></div></details></section>`;
}
function vToday(){
  const visibleEvents=allEvents().filter(e=>!isScheduleTrainingTime(e));
  const todays = sortEv(visibleEvents.filter(e => e.date <= TODAY && (e.endDate || e.date) >= TODAY));
  const soon = sortEv(visibleEvents.filter(e => e.date > TODAY && e.date <= addDays(TODAY, 14)));
  const notices = D.notices.filter(n=>!n.due||n.due>=TODAY).sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0, 3);
  const sub = isGuest() ? "로그인 없이 보는 중 · 공지·일정·방과후·공유글·대회·자격증·기업 안내·자료를 볼 수 있습니다." : T() ? "오늘 일정과 최근 공지입니다." : `${esc(D.me.name)} · ${esc(GROUP[myGroup()] || "")}에 해당하는 일정과 공지만 보여 줍니다.`;
  let h = `<div class="sec-h"><div><h2>${fmtMD(TODAY)} 오늘</h2><p>${sub}</p></div><div class="row">${isGuest()?'<button class="btn sm pri" data-login>로그인</button>':""}${!isGuest()&&!T()?'<button class="btn sm pri" data-intro-entry>자기소개서 파일 제출</button>':""}${canMyHome()?'<button class="btn sm" data-myhome-edit>화면 꾸미기</button>':""}<button class="btn sm" data-projsub="tools">무료 도구</button><button class="btn sm ghost" data-reload>새로고침</button></div></div>`;
  const cards={
    todo:()=>todayTodo(),
    notices:()=>`<section class="panel"><div class="pad row" style="padding-bottom:0"><span class="label">최근 공지</span><span class="spacer"></span><button class="btn sm ghost" data-go="notices">전체 보기</button></div>${notices.length ? notices.map(todayNoticeRow).join("") : emptyBox("아직 공지가 없습니다")}</section>`,
    meal:()=>todayMeal(),
    focus:()=>D.homeOnly?"":'<div class="today-focus" aria-label="오늘 확인할 일">'+todayActions()+todayResults()+todayTeamNews()+'</div>',
    events:()=>`<div class="grid2"><section class="panel"><div class="pad" style="padding-bottom:4px"><span class="label">오늘 일정</span></div>${todays.length ? todays.map(evRow).join("") : emptyBox("오늘 잡힌 일정이 없습니다")}</section>
    <section class="panel"><div class="pad" style="padding-bottom:4px"><span class="label">앞으로 2주</span></div>${soon.length ? soon.slice(0, 8).map(evRow).join("") : emptyBox("2주 안에 예정된 일정이 없습니다")}</section></div>`,
    contests:()=>todayContests(),
    details:()=>(D.homeOnly&&!isGuest())?'<section class="panel pad"><button class="btn" data-home-details>'+ (fullLoadPending?'활동 자료 확인 중…':'내 할 일·요청 결과·팀 소식 보기')+'</button><p class="ev-s">명단·출결·BOM 등은 메뉴를 열 때 불러옵니다.</p></section>':""
  };
  todayOrder().forEach(k=>{h+=cards[k]();});
  if (D.tabsMissing && D.tabsMissing.length && T()) h += `<div class="banner">시트에서 ‘${esc(D.tabsMissing.join("’, ‘"))}’ 탭을 찾지 못했습니다. Code.gs 위쪽의 탭 이름을 확인하세요.</div>`;
  if (T()&&!D.homeOnly){
    const rq = D.requests.filter(r => r.unreadTeacher).length, nopin = D.roster.filter(r => !r.pin).length;
    if (nopin && !D.loginDisabled && !D.studentLoginRequired) h += `<div class="banner row"><span>PIN이 없는 학생 ${nopin}명은 아직 들어올 수 없습니다.</span><span class="spacer"></span><button class="btn sm" data-go="roster">명단</button></div>`;
    const c = g => D.roster.filter(r => r.group === g).length;
    h += `<div class="stats"><div class="stat"><div class="v">${c("learner")}</div><div class="k">학습근로자</div></div>
      <div class="stat"><div class="v">${c("pre2")}<span class="muted" style="font-size:14px"> / ${c("pre1")}</span></div><div class="k">예비 2학년 / 1학년</div></div>
      <div class="stat"><div class="v">${(D.anonPosts || []).length}</div><div class="k">익명게시글</div></div>
      <div class="stat"><div class="v">${D.purchases.filter(p => p.state === "요청").length}</div><div class="k">새 구매요청</div></div></div>`;
  } else if(!T()&&!isGuest()) {
    const un = D.notices.filter(n => (!n.due||n.due>=TODAY)&&!D.myAcks.includes(n.id)).length;
    if (un) h += `<div class="banner row"><span>확인하지 않은 공지 ${un}건</span><span class="spacer"></span><button class="btn sm" data-go="notices">공지 보기</button></div>`;

  }
  return h;
}

async function noticePhotoData(id,original=false){
 const key=id+(original?':original':'');if(noticeImages.has(key))return noticeImages.get(key);
 if(noticeImagesPending.has(key))return noticeImagesPending.get(key);
 const req=call('noticeImage',{id,original}).then(f=>{const src='data:'+f.mime+';base64,'+f.base64;if(noticeImages.size>=30)noticeImages.delete(noticeImages.keys().next().value);noticeImages.set(key,src);return src;}).finally(()=>noticeImagesPending.delete(key));noticeImagesPending.set(key,req);return req;
}
function hydrateNoticeImages(){
 if(noticeObserver)noticeObserver.disconnect();
 noticeObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(!entry.isIntersecting)return;const img=entry.target.querySelector("[data-notice-img]");noticeObserver.unobserve(entry.target);if(!img)return;noticePhotoData(img.dataset.noticeImg).then(src=>{if(!img.isConnected)return;img.src=src;img.hidden=false;const st=img.parentElement.querySelector('[data-notice-img-status]');if(st)st.hidden=true;}).catch(()=>{if(!img.isConnected)return;const st=img.parentElement.querySelector('[data-notice-img-status]');if(st)st.textContent='사진 보기 · 원본 받기';});}),{rootMargin:'100px'});
 document.querySelectorAll('[data-notice-img]').forEach(img=>noticeObserver.observe(img.parentElement));
}

const sortedNotices = () => [...D.notices].sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0) || String(b.at).localeCompare(String(a.at)));
function noticeCard(n){
  let foot = "";
  if (T()){
    const targets = D.roster.filter(r => matches(n.target, r.group));
    const seen = D.acks.filter(a => a.id === n.id && targets.some(r=>r.name===a.name));
    foot = `<div class="row"><button class="btn sm" data-readers="${esc(n.id)}">확인 ${seen.length}명 / 대상 ${targets.length}명</button><span class="spacer"></span>
      <button class="btn sm ghost" data-editnotice="${esc(n.id)}">수정</button><button class="btn sm ghost danger" data-del="notices|${esc(n.id)}">삭제</button></div>`;
    if(D.homeOnly)foot='<button class="btn sm" data-home-details>확인 현황·공지 관리 불러오기</button>';
    if (!D.homeOnly&&openReaders.has(n.id)) { const un = targets.filter(r => !seen.some(a => a.name === r.name)).map(r => r.name);
      foot += `<div class="readers"><b>확인</b> ${seen.length ? seen.map(a => `${esc(a.name)} <span class="num">${esc(a.at.slice(5))}</span>`).join(" · ") : "없음"}<br><b>미확인</b> ${un.length ? esc(un.join(", ")) : "없음"}</div>`; }

function isHolidayEvent(e){
 const label=/^(?:(?:대체)?공휴일|대체휴일|임시공휴일|휴일|휴업일|재량휴업일|개교기념일|설날(?:연휴)?|설연휴|추석(?:연휴)?|부처님오신날|석가탄신일|신정|새해첫날|삼일절|어린이날|현충일|광복절|개천절|한글날|성탄절|크리스마스)(?:\s*[（(][^）)]*[）)])?$/;

function ojtCalendarEvents(from,days){

}

async function uploadMaterialsFiles(files){

    try{if(!file.size||file.size>MAX_MB*1024*1024)throw new Error('파일 크기는 0바이트 초과, '+sizeLimitText()+' 이하여야 합니다');

      await call('uploadDriveMaterial',{target,upload});uploaded++;upDone(file);

  }}finally{upEnd();materialsUploading=false;await reload();const status=$('#materialsUploadStatus');if(status)status.textContent=uploaded+'개 업로드 완료'+(errors.length?' · 실패 '+errors.length+'개: '+errors.join(' / '):'');toast(uploaded+'개 업로드 완료'+(errors.length?' · 일부 파일 실패':''));}

let upBatch = null, upTick = null, upHideT = null;
function upBegin(files){

}
function upIndex(f){

  if (i < 0) { upBatch.items.push({ name: f.name, size: f.size, pct: 0, text: "대기 중", state: "wait", t0: 0 }); i = upBatch.items.length - 1; }

}
function upSet(i, patch){ if (!upBatch || !upBatch.items[i]) return; const it = upBatch.items[i]; if (patch.state === "run" && !it.t0) it.t0 = Date.now(); Object.assign(it, patch); upPaint(); }

  const ok = upBatch.items.filter(x => x.state === "ok").length, bad = upBatch.items.length - ok;

}
function upPaint(){

/* 8MB 이하는 한 번에, 큰 파일은 4MB씩 나눠 Drive에 바로 이어 올린 뒤 {staged: 파일ID}로 넘김 */
async function toUpload(f){
  const i = upIndex(f);
  try {
    if (f.size <= DIRECT_MB * 1024 * 1024) { upSet(i, { state: "run", pct: null, text: "파일 읽는 중" }); const b64 = await blobB64(f); upSet(i, { state: "save", pct: null, text: "Google Drive로 보내는 중" }); return { name: f.name, base64: b64 }; }
    upSet(i, { state: "run", pct: 0, text: "업로드 준비 중" });
    const s = await call("uploadStart", { name: f.name, size: f.size });
    let off = 0, tries = 0;
    while (off < f.size) {
      const b64 = await blobB64(f.slice(off, Math.min(f.size, off + s.chunk)));
      let r; try { r = await call("uploadChunk", { id: s.id, offset: off, base64: b64 }); tries = 0; } catch (e) { if (++tries > 2) throw new Error(f.name + ": " + e.message); upSet(i, { text: "연결이 끊겨 다시 보내는 중 (" + tries + "/2)" }); continue; }
      off = r.got; const pct = Math.min(100, Math.round(off / f.size * 100)); upSet(i, { pct, text: pct + "% · " + fmtSize(off) + " / " + fmtSize(f.size) });
      if (r.staged) { upSet(i, { state: "save", pct: 100, text: "Drive 폴더에 저장 중" }); return { name: f.name, staged: r.staged }; }
    }
    throw new Error(f.name + ": 업로드를 마치지 못했습니다");
  } catch (e) { upSet(i, { state: "bad", text: "실패: " + e.message }); throw e; }
}

privateForm.addEventListener("submit",async e=>{
  e.preventDefault();if(!privateState)return;
  const state=privateState,epoch=privateEpoch,fd=Object.fromEntries(new FormData(privateForm)),button=privateForm.querySelector('button[type="submit"]');
  button.disabled=true;$("#privateError").textContent="";
  try{
    if(!state.unlocked){
      const result=await call("studentPrivate",{row:state.row,name:state.name,password:fd.password});
      if(epoch!==privateEpoch||!privateDlg.open)return;
      state.password=fd.password;state.unlocked=true;renderStudentPrivate(result);
      privateTimer=setTimeout(()=>{clearPrivate();privateDlg.close();toast("개인정보 창을 잠갔습니다");},5*60*1000);
    }else{
      await call("saveStudentPrivate",{...fd,row:state.row,name:state.name,password:state.password});
      if(epoch!==privateEpoch||!privateDlg.open)return;
      clearPrivate();privateDlg.close();toast("개인정보를 저장하고 잠갔습니다");

/* ---------- 내 오늘 화면 저장·꾸미기 ---------- */
let myHomeSaving=Promise.resolve();
function saveMyHome(next){
  const prev=D.myHome;D.myHome=next;if(!dlg.open)render();
  myHomeSaving=myHomeSaving.then(()=>call("saveMyHome",{home:next})).then(v=>{if(D&&D.myHome===next){D.myHome=v;}}).catch(e=>{if(D&&D.myHome===next){D.myHome=prev;if(!dlg.open)render();}toast(e.message);});
  return myHomeSaving;
}
const myHomeCopy=()=>JSON.parse(JSON.stringify(D.myHome||{todos:[],memo:"",cards:[],hidden:[],tabs:[],hiddenTabs:[]}));
$("#main").addEventListener("submit",e=>{
  if(e.target.id!=="todoAdd")return;e.preventDefault();
  const t=$("#todoText").value.trim(),due=$("#todoDue").value;if(!t)return;
  const h=myHomeCopy();if((h.todos||[]).length>=60){toast("할 일은 60개까지 저장됩니다. 끝난 일을 지워 주세요");return;}
  h.todos=[{id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),t,d:false,due}].concat(h.todos||[]);saveMyHome(h);
});
$("#main").addEventListener("change",e=>{
  const id=e.target.dataset&&e.target.dataset.todoDone;if(!id)return;
  const h=myHomeCopy();h.todos=(h.todos||[]).map(t=>t.id===id?{...t,d:e.target.checked}:t);saveMyHome(h);
});
$("#main").addEventListener("click",e=>{

  const del=e.target.closest("[data-todo-del]");if(del){const h=myHomeCopy();h.todos=(h.todos||[]).filter(t=>t.id!==del.dataset.todoDel);saveMyHome(h);return;}

  if(e.target.closest("[data-today-pevent]")){peventDlg(null,{stay:true});return;}
  if(e.target.closest("[data-myhome-edit]"))myHomeDlg();

function myHomeDlg(){
  const h=myHomeCopy(),cardHidden=new Set(h.hidden||[]),tabHidden=new Set(h.hiddenTabs||[]);
  const cards=TODAY_CARDS.filter(([k])=>!(k==="focus"&&false)),cardPos=k=>{const i=(h.cards||[]).indexOf(k);return i<0?100+TODAY_CARDS.findIndex(c=>c[0]===k):i;};
  const tabs=baseTabs(),tabPos=k=>{const i=(h.tabs||[]).indexOf(k);return i<0?100+tabs.findIndex(c=>c[0]===k):i;};
  const item=(k,l,on,fixed)=>`<div class="mh-item" data-k="${esc(k)}"><label><input type="checkbox" data-mh-show ${on?"checked":""} ${fixed?"disabled":""}> ${esc(l)}${fixed?' <span class="ev-s">(항상 보임)</span>':""}</label><button class="btn sm ghost" type="button" data-mh-up aria-label="${esc(l)} 위로">↑</button><button class="btn sm ghost" type="button" data-mh-down aria-label="${esc(l)} 아래로">↓</button></div>`;
  openDlg("내 화면 꾸미기",`<p class="ev-s" style="margin:0">체크를 풀면 숨겨지고, ↑↓로 순서를 바꿉니다. 이 계정으로 어느 기기에서 들어와도 같게 보입니다.</p>
    <h4 style="margin:12px 0 4px">오늘 화면 카드</h4><div class="mh-list" data-mh="cards">${cards.slice().sort((a,b)=>cardPos(a[0])-cardPos(b[0])).map(([k,l])=>item(k,l,!cardHidden.has(k),false)).join("")}</div>
    <h4 style="margin:14px 0 4px">메뉴</h4><div class="mh-list" data-mh="tabs">${tabs.slice().sort((a,b)=>tabPos(a[0])-tabPos(b[0])).map(([k,l])=>item(k,l,!tabHidden.has(k),k==="today"||k==="me")).join("")}</div>
    <div class="row" style="margin-top:10px"><button class="btn sm ghost" type="button" data-mh-reset>처음 모양으로</button></div>`,"저장",async()=>{
      const read=name=>[...form.querySelectorAll('[data-mh="'+name+'"] .mh-item')].map(el=>({k:el.dataset.k,on:el.querySelector("[data-mh-show]").checked}));
      const c=read("cards"),t=read("tabs"),next=myHomeCopy();
      next.cards=c.map(x=>x.k);next.hidden=c.filter(x=>!x.on).map(x=>x.k);next.tabs=t.map(x=>x.k);next.hiddenTabs=t.filter(x=>!x.on&&x.k!=="today"&&x.k!=="me").map(x=>x.k);
      dlg.close();await saveMyHome(next);render();toast("내 화면을 저장했습니다");return true;
    });
}
form.addEventListener("click",e=>{
  const it=e.target.closest(".mh-item");if(!it)return;
  if(e.target.closest("[data-mh-up]")&&it.previousElementSibling)it.parentNode.insertBefore(it,it.previousElementSibling);
  else if(e.target.closest("[data-mh-down]")&&it.nextElementSibling)it.parentNode.insertBefore(it.nextElementSibling,it);
});
form.addEventListener("click",e=>{if(!e.target.closest("[data-mh-reset]"))return;const h=myHomeCopy();h.cards=[];h.hidden=[];h.tabs=[];h.hiddenTabs=[];dlg.close();saveMyHome(h).then(()=>{render();toast("처음 모양으로 되돌렸습니다");});});
